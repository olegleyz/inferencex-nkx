          - "CONFIG_FILE=recipes/vllm/minimax-m3-gb300-fp8/8k1k/2p4d-dep2-tep4-8k1k.yaml"
        decode:
          num-worker: 4
          tp: 4
          ep: 4
          dp-attn: false
