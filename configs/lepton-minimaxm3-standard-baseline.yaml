# Exact upstream 11-point MiniMax M3 MXFP8 matrix for GB300.
# Baseline InferenceX source: af285ca48da805cf5bd7419010333824fef2fd9b.

minimaxm3-fp8-gb300-dynamo-vllm-standard:
